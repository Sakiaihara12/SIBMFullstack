<!DOCTYPE html>
<html lang="id">
<head>

  <title>Tugas Pertemuan 3 - JS: Manajemen Produk Toko</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f4f4;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 600px;
      background-color: #ffffff;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid #999;
      padding: 8px 12px;

    }
    th {

      color: #ffffff;
    }

      font-size: 13px;
      color: #555;
    }

  <h1>Manajemen Produk Toko Online</h1>

  <table>
    <thead>
      <tr>
        <th>ID</th>

        <th>Stok</th>
      </tr>
    </thead>
    <tbody id="isiTabelProduk">

    </tbody>
  </table>

  <script src="script.js"></script>

</html>
